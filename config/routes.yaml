# yaml-language-server: $schema=../vendor/symfony/routing/Loader/schema/routing.schema.json

# Attribute controllers under modular Infrastructure/API (and elsewhere with #[Route]).
controllers:
    resource:
        path: ../src/
        namespace: App\
    type: attribute

# Firewall json_login check_path (no controller — handled by Security)
api_login:
    path: /api/login
    methods: [POST]
