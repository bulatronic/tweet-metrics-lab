# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    elasticsearch.url: '%env(ELASTICSEARCH_URL)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # PhpRedis connection to the same redis service as redis-exporter (CACHE_DSN → redis:6379).
    app.redis:
        class: Redis
        factory: ['Symfony\Component\Cache\Adapter\RedisAdapter', 'createConnection']
        arguments:
            - '%env(CACHE_DSN)%'

    Redis: '@app.redis'

    App\User\:
        resource: '../src/User/'
        exclude:
            - '../src/User/Domain/Entity/'
            - '../src/User/Domain/ValueObject/'
            - '../src/User/Infrastructure/Persistence/DoctrineUser.php'
            - '../src/User/Infrastructure/Persistence/RefreshToken.php'

    App\Tweet\:
        resource: '../src/Tweet/'
        exclude:
            - '../src/Tweet/Domain/Entity/'
            - '../src/Tweet/Domain/ValueObject/'
            - '../src/Tweet/Infrastructure/Persistence/DoctrineTweet.php'
            - '../src/Tweet/Infrastructure/Persistence/DoctrineFeedItem.php'

    App\Like\:
        resource: '../src/Like/'
        exclude:
            - '../src/Like/Domain/Entity/'
            - '../src/Like/Domain/ValueObject/'
            - '../src/Like/Infrastructure/Persistence/DoctrineLike.php'

    App\Follow\:
        resource: '../src/Follow/'
        exclude:
            - '../src/Follow/Domain/Entity/'
            - '../src/Follow/Domain/ValueObject/'
            - '../src/Follow/Infrastructure/Persistence/DoctrineFollow.php'

    App\Search\:
        resource: '../src/Search/'

    Elastic\Elasticsearch\Client:
        factory: ['App\Search\Infrastructure\Elasticsearch\ElasticsearchClientFactory', 'create']
        arguments:
            - '%elasticsearch.url%'

    App\Shared\:
        resource: '../src/Shared/'
        exclude:
            - '../src/Shared/Domain/'
            - '../src/Shared/Infrastructure/Outbox/OutboxMessage.php'

    # Domain repository → Doctrine implementations
    App\User\Domain\Repository\UserRepositoryInterface: '@App\User\Infrastructure\Persistence\DoctrineUserRepository'
    App\Tweet\Domain\Repository\TweetRepositoryInterface: '@App\Tweet\Infrastructure\Persistence\DoctrineTweetRepository'
    App\Like\Domain\Repository\LikeRepositoryInterface: '@App\Like\Infrastructure\Persistence\DoctrineLikeRepository'
    App\Follow\Domain\Repository\FollowRepositoryInterface: '@App\Follow\Infrastructure\Persistence\DoctrineFollowRepository'

    App\User\Domain\Service\PasswordHasherInterface: '@App\User\Infrastructure\Service\SymfonyPasswordHasher'
    App\Shared\Domain\EventPublisherInterface: '@App\Shared\Infrastructure\Outbox\DoctrineOutboxPublisher'
    App\Tweet\Application\FeedCacheMetricsInterface: '@App\Shared\Infrastructure\Metrics\FeedMetrics'

    Lexik\Bundle\JWTAuthenticationBundle\TokenExtractor\TokenExtractorInterface: '@lexik_jwt_authentication.extractor.chain_extractor'

    # Share artprima's CollectorRegistry with tasko messenger metrics
    # so counters/gauges appear on /metrics/prometheus (Redis-backed).
    Prometheus\CollectorRegistry: '@prometheus_metrics_bundle.collector_registry'
    Prometheus\RegistryInterface: '@prometheus_metrics_bundle.collector_registry'

    App\User\Infrastructure\Security\ApiKitAuthenticationSuccessHandler:
        arguments:
            $inner: '@lexik_jwt_authentication.handler.authentication_success'

    App\User\Infrastructure\Security\ApiKitAuthenticationFailureHandler:
        arguments:
            $inner: '@lexik_jwt_authentication.handler.authentication_failure'
