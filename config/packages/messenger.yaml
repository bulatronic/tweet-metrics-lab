framework:
    messenger:
        default_bus: command.bus

        buses:
            command.bus:
                middleware:
                    - App\Shared\Infrastructure\Messenger\CommandMetricsMiddleware

            event.bus:
                default_middleware:
                    allow_no_handlers: true
                middleware:
                    - TaskoProducts\SymfonyPrometheusExporterBundle\Middleware\MessengerEventMiddleware

        transports:
            async: '%env(MESSENGER_TRANSPORT_DSN)%'
            sync: 'sync://'

        routing:
            # Domain events published by outbox relay go to RabbitMQ
            'App\Tweet\Domain\Event\TweetWasCreated': async
            'App\Tweet\Domain\Event\TweetWasLiked': async
            'App\Tweet\Domain\Event\TweetWasUnliked': async
            'App\Follow\Domain\Event\UserWasFollowed': async
            'App\Follow\Domain\Event\UserWasUnfollowed': async

