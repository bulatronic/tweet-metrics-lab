lexik_jwt_authentication:
    secret_key: '%env(resolve:JWT_SECRET_KEY)%'
    public_key: '%env(resolve:JWT_PUBLIC_KEY)%'
    pass_phrase: '%env(JWT_PASSPHRASE)%'
    token_ttl: 900 # 15 minutes
    # Must match security provider property (email), not DoctrineUser::getUsername().
    user_id_claim: email
    # Custom Redis jti blacklist + jwt_decoded listener (see User/Infrastructure).
    blocklist_token:
        enabled: false
