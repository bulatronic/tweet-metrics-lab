framework:
    cache:
        prefix_seed: tweet_metrics_lab
        app: cache.adapter.redis
        default_redis_provider: '%env(CACHE_DSN)%'
        pools:
            cache.feed:
                adapter: cache.app
                default_lifetime: 30

when@test:
    framework:
        cache:
            app: cache.adapter.array
            pools:
                cache.feed:
                    adapter: cache.app
                    default_lifetime: 30
