services:
    frankenphp:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: tweet-app
        restart: unless-stopped
        ports:
            - "8000:80"
        volumes:
            - .:/app
        environment:
            - APP_ENV=dev
            - APP_DEBUG=1
        command: [ "frankenphp", "run", "--config", "/app/Caddyfile" ]
        networks:
            - tweet-network
        depends_on:
            - database
            - redis
            - rabbitmq
            - elasticsearch

    # Читает outbox-таблицу, публикует в RabbitMQ
    outbox-relay:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: tweet-outbox-relay
        restart: unless-stopped
        volumes:
            - .:/app
        environment:
            - APP_ENV=dev
            - APP_DEBUG=1
        command: [ "php", "bin/console", "app:outbox:relay" ]
        networks:
            - tweet-network
        depends_on:
            - database
            - rabbitmq

    # Обрабатывает async-очередь (feed projection, counters, search, …)
    messenger-worker:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: tweet-messenger-worker
        restart: unless-stopped
        volumes:
            - .:/app
        environment:
            - APP_ENV=dev
            - APP_DEBUG=1
        command:
            - php
            - bin/console
            - messenger:consume
            - async
            - --memory-limit=256M
            - -vv
        networks:
            - tweet-network
        depends_on:
            - database
            - redis
            - rabbitmq
            - elasticsearch

    database:
        image: postgres:18-alpine
        container_name: tweet-database
        restart: unless-stopped
        environment:
            POSTGRES_DB: app
            POSTGRES_USER: app
            POSTGRES_PASSWORD: pass
        ports:
            - "5432:5432"
        volumes:
            - db-data:/var/lib/postgresql
        networks:
            - tweet-network

    redis:
        image: redis:alpine
        container_name: tweet-cache
        restart: unless-stopped
        ports:
            - "6379:6379"
        volumes:
            - cache-data:/data
        command: redis-server --save 60 1 --loglevel warning
        networks:
            - tweet-network

    rabbitmq:
        image: rabbitmq:3-management-alpine
        container_name: tweet-rabbitmq
        restart: unless-stopped
        environment:
            RABBITMQ_DEFAULT_USER: guest
            RABBITMQ_DEFAULT_PASS: guest
        ports:
            - "5672:5672"
            - "15672:15672"
            - "15692:15692"
        volumes:
            - rabbitmq-data:/var/lib/rabbitmq
            - ./docker/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
        networks:
            - tweet-network

    elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
        container_name: tweet-elasticsearch
        restart: unless-stopped
        environment:
            - discovery.type=single-node
            - xpack.security.enabled=false
        ports:
            - "9200:9200"
        volumes:
            - elasticsearch-data:/usr/share/elasticsearch/data
        networks:
            - tweet-network

    prometheus:
        image: prom/prometheus:latest
        container_name: tweet-prometheus
        restart: unless-stopped
        ports:
            - "9090:9090"
        volumes:
            - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - prometheus-data:/prometheus
        command:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
        networks:
            - tweet-network
        depends_on:
            - frankenphp
            - postgres-exporter
            - redis-exporter
            - rabbitmq
            - elasticsearch-exporter
            - node-exporter

    grafana:
        image: grafana/grafana:latest
        container_name: tweet-grafana
        restart: unless-stopped
        environment:
            - GF_SECURITY_ADMIN_USER=admin
            - GF_SECURITY_ADMIN_PASSWORD=admin
            - GF_USERS_ALLOW_SIGN_UP=false
        ports:
            - "3000:3000"
        volumes:
            - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
            - grafana-data:/var/lib/grafana
        networks:
            - tweet-network
        depends_on:
            - prometheus

    postgres-exporter:
        image: prometheuscommunity/postgres-exporter:latest
        container_name: tweet-postgres-exporter
        restart: unless-stopped
        environment:
            DATA_SOURCE_NAME: postgresql://app:pass@database:5432/app?sslmode=disable
        ports:
            - "9187:9187"
        networks:
            - tweet-network
        depends_on:
            - database

    redis-exporter:
        image: oliver006/redis_exporter:latest
        container_name: tweet-redis-exporter
        restart: unless-stopped
        environment:
            REDIS_ADDR: redis://redis:6379
        ports:
            - "9121:9121"
        networks:
            - tweet-network
        depends_on:
            - redis

    elasticsearch-exporter:
        image: quay.io/prometheuscommunity/elasticsearch-exporter:latest
        container_name: tweet-elasticsearch-exporter
        restart: unless-stopped
        command:
            - --es.uri=http://elasticsearch:9200
        ports:
            - "9114:9114"
        networks:
            - tweet-network
        depends_on:
            - elasticsearch

    node-exporter:
        image: prom/node-exporter:latest
        container_name: tweet-node-exporter
        restart: unless-stopped
        pid: host
        volumes:
            - /proc:/host/proc:ro
            - /sys:/host/sys:ro
            - /:/rootfs:ro
        command:
            - --path.procfs=/host/proc
            - --path.sysfs=/host/sys
            - --path.rootfs=/rootfs
            - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
        ports:
            - "9100:9100"
        networks:
            - tweet-network

volumes:
    db-data:
    cache-data:
    rabbitmq-data:
    elasticsearch-data:
    prometheus-data:
    grafana-data:

networks:
    tweet-network:
        driver: bridge
        name: tweet-network
