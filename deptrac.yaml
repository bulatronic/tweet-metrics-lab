deptrac:
    paths:
        - ./src
    exclude_files:
        - '#.*test.*#'
        - '#.*Kernel\.php$#'
        - '#.*DataFixtures.*#'
    layers:
        -   name: Domain
            collectors:
                -   type: classLike
                    value: App\\.+\\Domain\\.*
                -   type: classLike
                    value: App\\Shared\\Domain\\.*
        -   name: Application
            collectors:
                -   type: classLike
                    value: App\\.+\\Application\\.*
        -   name: Infrastructure
            collectors:
                -   type: classLike
                    value: App\\.+\\Infrastructure\\.*
                -   type: classLike
                    value: App\\Shared\\Infrastructure\\.*
    ruleset:
        Domain: ~
        Application:
            - Domain
        Infrastructure:
            - Domain
            - Application
